<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Vehículos</title>
<style>
:root{
  --bg:#f3f4f6;
  --card:#ffffff;
  --line:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
  --dark:#111827;
  --soft:#f9fafb;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{
  width:100%;
  max-width:1280px;
  margin:0 auto;
  padding:clamp(10px,2vw,18px);
}
.header,.box,.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:clamp(16px,2vw,24px);
}
.header{
  padding:clamp(16px,3vw,26px);
  margin-bottom:16px;
}
h1{
  margin:0;
  font-size:clamp(24px,4vw,36px);
  line-height:1.1;
}
h2{
  margin:0 0 6px;
  font-size:clamp(22px,3vw,30px);
  line-height:1.15;
}
h3{
  margin:0 0 6px;
  font-size:clamp(18px,2.5vw,22px);
  line-height:1.2;
}
.small{
  font-size:clamp(12px,1.8vw,14px);
  color:var(--muted);
  line-height:1.35;
}
.top{
  display:grid;
  grid-template-columns:minmax(260px,320px) minmax(0,1fr);
  gap:16px;
  margin-bottom:16px;
  align-items:start;
}
.box{padding:clamp(12px,2vw,16px)}
.filters{
  display:grid;
  gap:10px;
}
input,select,button{
  width:100%;
  min-height:44px;
  padding:12px 14px;
  border-radius:14px;
  border:1px solid var(--line);
  font:inherit;
  font-size:16px;
}
button{
  background:var(--dark);
  color:#fff;
  border:none;
  cursor:pointer;
}
.hero{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
  align-items:start;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
}
.card{
  padding:clamp(12px,2vw,16px);
  overflow:hidden;
}
.pr3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin:10px 0;
}
.pr2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-bottom:10px;
}
.p,.s{
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:14px;
  padding:clamp(8px,1.6vw,11px);
  min-width:0;
}
.p small,.s small{
  display:block;
  color:var(--muted);
  font-size:clamp(10px,1.7vw,12px);
  line-height:1.2;
}
.p b,.s b{
  display:block;
  margin-top:4px;
  font-size:clamp(12px,2vw,16px);
  line-height:1.15;
  word-break:break-word;
}
.specs{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.actions button:last-child{
  background:#fff;
  color:#111;
  border:1px solid var(--line);
}

.search-results{
  display:none;
  margin-top:8px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  overflow:hidden;
}
.search-results.active{display:block}
.search-result-item{
  display:block;
  width:100%;
  text-align:left;
  background:#fff;
  color:var(--text);
  border:none;
  border-bottom:1px solid var(--line);
  border-radius:0;
  padding:12px;
  cursor:pointer;
}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:#f9fafb}
.search-result-title{font-weight:700;font-size:14px;line-height:1.25}
.search-result-sub{color:var(--muted);font-size:12px;margin-top:3px}
.search-result-price{color:#111827;font-size:12px;margin-top:5px}
.result-count{margin-top:4px;font-size:13px;color:var(--muted)}
.card.highlight,.hero.highlight{outline:3px solid #111827;outline-offset:2px}
@media(max-width:900px){
  .top{grid-template-columns:1fr}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters button{grid-column:1/-1}
  .hero{grid-template-columns:1fr}
}
@media(max-width:640px){
  .wrap{padding:10px}
  .header{padding:18px}
  .filters{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
    .pr3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .pr2{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .specs{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .actions{grid-template-columns:1fr}
  .p,.s{padding:8px 6px}
  .p b,.s b{font-size:12px}
  .p small,.s small{font-size:10px}
}
@media(max-width:380px){
  .pr3{grid-template-columns:1fr}
  .pr2{grid-template-columns:1fr}
  .specs{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">

<div class="header">
<h1>Catálogo de Vehículos</h1>
</div>

<div class="top">
<div class="box">
<div class="filters">
<input id="search" placeholder="Buscar marca, modelo o versión">
<div id="resultCount" class="result-count"></div>
<div id="searchResults" class="search-results"></div>
<select id="brand"><option value="">Todas las marcas</option></select>
<select id="fuel"><option value="">Todo combustible</option></select>
<select id="sort">
<option value="">Orden normal</option>
<option value="low">Precio menor</option>
<option value="high">Precio mayor</option>
</select>
<button onclick="clearFilters()">Limpiar filtros</button>
</div>
</div>

<div class="box hero">
<div>
<h2 id="heroTitle">Catálogo</h2>
<div class="small" id="heroVersion"></div>

<div class="pr3">
<div class="p"><small>Precio lista</small><b id="pl">-</b></div>
<div class="p"><small>Bono marca</small><b id="bm">-</b></div>
<div class="p"><small>Precio contado</small><b id="pc">-</b></div>
</div>

<div class="pr2">
<div class="p"><small>Bono Amicar</small><b id="ba">-</b></div>
<div class="p"><small>Financiamiento</small><b id="pf">-</b></div>
</div>

<div class="specs">
<div class="s"><small>Motor</small><b id="m1">-</b></div>
<div class="s"><small>Transmisión</small><b id="m2">-</b></div>
<div class="s"><small>Combustible</small><b id="m3">-</b></div>
<div class="s"><small>Rendimiento</small><b id="m4">-</b></div>
<div class="s"><small>HP</small><b id="m5">-</b></div>
<div class="s"><small>Torque</small><b id="m6">-</b></div>
<div class="s"><small>Maletero</small><b id="m7">-</b></div>
</div>
</div>
</div>
</div>

<div id="grid" class="grid"></div>

</div>

<script>
let vehicles=[];

function money(n){ return "$"+Number(n||0).toLocaleString("es-CL"); }
function text(v){ return (v===undefined || v===null || v==="") ? "-" : String(v); }
function image(v,i){
 if(v.image && String(v.image).trim()!=="") return v.image;
 return "https://picsum.photos/seed/car"+i+"/800/500";
}

function hero(v,i){
document.getElementById("heroTitle").innerText=(v.brand||"")+" "+(v.model||"");
document.getElementById("heroVersion").innerText=text(v.version);
document.getElementById("pl").innerText=money(v.listPrice);
document.getElementById("bm").innerText=money(v.brandBonus);
document.getElementById("pc").innerText=money(v.cashPrice);
document.getElementById("ba").innerText=money(v.amicarBonus);
document.getElementById("pf").innerText=money(v.financePrice);
document.getElementById("m1").innerText=text(v.motor);
document.getElementById("m2").innerText=text(v.transmission);
document.getElementById("m3").innerText=text(v.fuel);
document.getElementById("m4").innerText=text(v.mixedEfficiency);
document.getElementById("m5").innerText=text(v.hp);
document.getElementById("m6").innerText=text(v.torque);
document.getElementById("m7").innerText=text(v.trunkCapacity);
}

function fillFilters(){
const brands=[...new Set(vehicles.map(v=>v.brand).filter(Boolean))].sort();
const fuels=[...new Set(vehicles.map(v=>v.fuel).filter(Boolean))].sort();

document.getElementById("brand").innerHTML =
'<option value="">Todas las marcas</option>' +
brands.map(v=>`<option value="${v}">${v}</option>`).join("");

document.getElementById("fuel").innerHTML =
'<option value="">Todo combustible</option>' +
fuels.map(v=>`<option value="${v}">${v}</option>`).join("");
}

function makeWhatsappText(v){
  return `Hola, le comparto la cotización del modelo ${text(v.brand)} ${text(v.model)} ${text(v.version)}. Precio contado: ${money(v.cashPrice)}.`;
}

function render(list){
const grid=document.getElementById("grid");
grid.innerHTML="";

if(list.length===0){
grid.innerHTML="<div class='box'>Sin resultados</div>";
return;
}

hero(list[0],0);

const frag=document.createDocumentFragment();

list.forEach((v,i)=>{
  const idx = vehicles.indexOf(v);
  const card=document.createElement("div");
  card.className="card";
  card.id="card-"+idx;
  card.innerHTML = `
        <h3>${text(v.brand)} ${text(v.model)}</h3>
    <div class="small">${text(v.version)}</div>

    <div class="pr3">
      <div class="p"><small>Lista</small><b>${money(v.listPrice)}</b></div>
      <div class="p"><small>Bono</small><b>${money(v.brandBonus)}</b></div>
      <div class="p"><small>Contado</small><b>${money(v.cashPrice)}</b></div>
    </div>

    <div class="pr2">
      <div class="p"><small>Amicar</small><b>${money(v.amicarBonus)}</b></div>
      <div class="p"><small>Financia</small><b>${money(v.financePrice)}</b></div>
    </div>

    <div class="actions">
      <button class="btn-ver">Ver</button>
      <button class="btn-wa">WhatsApp</button>
    </div>
  `;
  card.querySelector(".btn-ver").addEventListener("click",()=>{
    goToVehicle(idx);
  });
  card.querySelector(".btn-wa").addEventListener("click",async ()=>{
    const txt=makeWhatsappText(v);
    try{
      await navigator.clipboard.writeText(txt);
      alert("Texto copiado");
    }catch{
      alert(txt);
    }
  });
  frag.appendChild(card);
});

grid.appendChild(frag);
}

function normalizeSearch(v){
  return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function getFiltered(){
const q=normalizeSearch(document.getElementById("search").value);
const b=document.getElementById("brand").value;
const f=document.getElementById("fuel").value;
const s=document.getElementById("sort").value;

let r=vehicles.filter(v=>{
const t=normalizeSearch(String(v.brand)+" "+String(v.model)+" "+String(v.version));
return (!q || t.includes(q)) && (!b || v.brand===b) && (!f || v.fuel===f);
});

if(s==="low") r.sort((a,b)=>Number(a.cashPrice||0)-Number(b.cashPrice||0));
if(s==="high") r.sort((a,b)=>Number(b.cashPrice||0)-Number(a.cashPrice||0));
return r;
}

function renderSearchResults(list){
const query=document.getElementById("search").value.trim();
const box=document.getElementById("searchResults");
const count=document.getElementById("resultCount");

if(!query){
  box.classList.remove("active");
  box.innerHTML="";
  count.innerText="";
  return;
}

count.innerText = list.length===1 ? "1 resultado encontrado" : list.length+" resultados encontrados";

if(list.length===0){
  box.classList.add("active");
  box.innerHTML='<button class="search-result-item" type="button"><div class="search-result-title">Sin resultados</div><div class="search-result-sub">Prueba con otra palabra</div></button>';
  return;
}

box.classList.add("active");
box.innerHTML=list.slice(0,12).map(v=>{
  const idx=vehicles.indexOf(v);
  return `<button class="search-result-item" type="button" data-idx="${idx}">
    <div class="search-result-title">${text(v.brand)} ${text(v.model)}</div>
    <div class="search-result-sub">${text(v.version)}</div>
    <div class="search-result-price">Precio contado: ${money(v.cashPrice)}</div>
  </button>`;
}).join("");

box.querySelectorAll(".search-result-item[data-idx]").forEach(btn=>{
  btn.addEventListener("click",()=>goToVehicle(Number(btn.dataset.idx)));
});
}

function goToVehicle(idx){
const vehicle=vehicles[idx];
if(!vehicle) return;

// Envía el resultado seleccionado directamente a la ficha extendida superior
hero(vehicle, idx);

// Oculta el listado de resultados para dejar limpia la vista
document.getElementById("searchResults").classList.remove("active");

// Lleva la pantalla a la ficha extendida, no a la tarjeta
const ficha=document.querySelector(".hero");
if(ficha){
  ficha.scrollIntoView({behavior:"smooth", block:"start"});
  ficha.classList.add("highlight");
  setTimeout(()=>ficha.classList.remove("highlight"),1600);
}
}

function apply(){
const r=getFiltered();
render(r);
renderSearchResults(r);
}

function clearFilters(){
document.getElementById("search").value="";
document.getElementById("brand").value="";
document.getElementById("fuel").value="";
document.getElementById("sort").value="";
apply();
}

async function loadJSON(){
try{
  const response = await fetch("./catalogo.json?v="+Date.now(), {cache:"no-store"});
  if(!response.ok) throw new Error("No se encontró catalogo.json");

  const data = await response.json();
  vehicles = Array.isArray(data) ? data : [];

  fillFilters();
  apply();
}catch(error){
  console.error(error);
}
}

document.getElementById("search").addEventListener("input",apply);
document.getElementById("brand").addEventListener("change",apply);
document.getElementById("fuel").addEventListener("change",apply);
document.getElementById("sort").addEventListener("change",apply);

loadJSON();
</script>
</body>
</html>
