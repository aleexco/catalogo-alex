<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Vehículos</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--dark:#111827}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1280px;margin:auto;padding:16px}
.header,.box,.card{background:#fff;border:1px solid var(--line);border-radius:22px}
.header{padding:24px;margin-bottom:16px}
h1{margin:0 0 6px;font-size:32px}
.small{font-size:14px;color:var(--muted)}
.top{display:grid;grid-template-columns:320px 1fr;gap:16px;margin-bottom:16px}
.box{padding:16px}
.filters{display:grid;gap:10px}
input,select,button{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);font:inherit}
button{background:var(--dark);color:#fff;border:none;cursor:pointer}
.hero{display:grid;grid-template-columns:340px 1fr;gap:16px}
.hero img,.card img{width:100%;height:230px;object-fit:cover;border-radius:18px;background:#ddd}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{padding:14px}
.pr3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pr2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.p,.s{background:#f9fafb;border:1px solid var(--line);border-radius:14px;padding:10px}
.p b,.s b{display:block;margin-top:4px}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.actions button:last-child{background:#fff;color:#111;border:1px solid var(--line)}
#status{margin-top:8px;color:#2563eb}
@media(max-width:980px){.top,.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.wrap{padding:12px}h1{font-size:26px}.grid{grid-template-columns:1fr}.pr3{grid-template-columns:repeat(3,1fr)}.pr2{grid-template-columns:repeat(2,1fr)}.specs{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">

<div class="header">
<h1>Catálogo de Vehículos</h1>
</div>

<div class="top">
<div class="box">
<div class="filters">
<input id="search" placeholder="Buscar marca, modelo o versión">
<select id="brand"><option value="">Todas las marcas</option></select>
<select id="fuel"><option value="">Todo combustible</option></select>
<select id="sort">
<option value="">Orden normal</option>
<option value="low">Precio menor</option>
<option value="high">Precio mayor</option>
</select>
<button onclick="clearFilters()">Limpiar</button>
</div>
</div>

<div class="box hero">
<img id="heroImg" src="">
<div>
<h2 id="heroTitle">Esperando datos...</h2>
<div class="small" id="heroVersion"></div>

<div class="pr3">
<div class="p"><small>Precio lista</small><b id="pl">-</b></div>
<div class="p"><small>Bono marca</small><b id="bm">-</b></div>
<div class="p"><small>Precio contado</small><b id="pc">-</b></div>
</div>

<div class="pr2">
<div class="p"><small>Bono Amicar</small><b id="ba">-</b></div>
<div class="p"><small>Financiamiento</small><b id="pf">-</b></div>
</div>

<div class="specs">
<div class="s"><small>Motor</small><b id="m1">-</b></div>
<div class="s"><small>Transmisión</small><b id="m2">-</b></div>
<div class="s"><small>Combustible</small><b id="m3">-</b></div>
<div class="s"><small>Rendimiento</small><b id="m4">-</b></div>
<div class="s"><small>HP</small><b id="m5">-</b></div>
<div class="s"><small>Torque</small><b id="m6">-</b></div>
<div class="s"><small>Maletero</small><b id="m7">-</b></div>
</div>
</div>
</div>
</div>

<div id="grid" class="grid"></div>

</div>

<script>
let vehicles=[];

function money(n){ return "$"+Number(n||0).toLocaleString("es-CL"); }
function text(v){ return (v===undefined || v===null || v==="") ? "-" : String(v); }
function image(v,i){
 if(v.image && String(v.image).trim()!=="") return v.image;
 return "https://picsum.photos/seed/car"+i+"/800/500";
}

function hero(v,i){
document.getElementById("heroImg").src=image(v,i);
document.getElementById("heroTitle").innerText=(v.brand||"")+" "+(v.model||"");
document.getElementById("heroVersion").innerText=text(v.version);
document.getElementById("pl").innerText=money(v.listPrice);
document.getElementById("bm").innerText=money(v.brandBonus);
document.getElementById("pc").innerText=money(v.cashPrice);
document.getElementById("ba").innerText=money(v.amicarBonus);
document.getElementById("pf").innerText=money(v.financePrice);
document.getElementById("m1").innerText=text(v.motor);
document.getElementById("m2").innerText=text(v.transmission);
document.getElementById("m3").innerText=text(v.fuel);
document.getElementById("m4").innerText=text(v.mixedEfficiency);
document.getElementById("m5").innerText=text(v.hp);
document.getElementById("m6").innerText=text(v.torque);
document.getElementById("m7").innerText=text(v.trunkCapacity);
}

function fillFilters(){
const brands=[...new Set(vehicles.map(v=>v.brand).filter(Boolean))].sort();
const fuels=[...new Set(vehicles.map(v=>v.fuel).filter(Boolean))].sort();

document.getElementById("brand").innerHTML =
'<option value="">Todas las marcas</option>' +
brands.map(v=>`<option value="${v}">${v}</option>`).join("");

document.getElementById("fuel").innerHTML =
'<option value="">Todo combustible</option>' +
fuels.map(v=>`<option value="${v}">${v}</option>`).join("");
}

function makeWhatsappText(v){
  return `Hola, le comparto la cotización del modelo ${text(v.brand)} ${text(v.model)} ${text(v.version)}. Precio contado: ${money(v.cashPrice)}.`;
}

function render(list){
const grid=document.getElementById("grid");
grid.innerHTML="";

if(list.length===0){
grid.innerHTML="<div class='box'>Sin resultados</div>";
return;
}

hero(list[0],0);

const frag=document.createDocumentFragment();

list.forEach((v,i)=>{
  const idx = vehicles.indexOf(v);
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML = `
    <img src="${image(v,i)}" alt="">
    <h3>${text(v.brand)} ${text(v.model)}</h3>
    <div class="small">${text(v.version)}</div>

    <div class="pr3">
      <div class="p"><small>Lista</small><b>${money(v.listPrice)}</b></div>
      <div class="p"><small>Bono</small><b>${money(v.brandBonus)}</b></div>
      <div class="p"><small>Contado</small><b>${money(v.cashPrice)}</b></div>
    </div>

    <div class="pr2">
      <div class="p"><small>Amicar</small><b>${money(v.amicarBonus)}</b></div>
      <div class="p"><small>Financia</small><b>${money(v.financePrice)}</b></div>
    </div>

    <div class="actions">
      <button class="btn-ver">Ver</button>
      <button class="btn-wa">WhatsApp</button>
    </div>
  `;
  card.querySelector(".btn-ver").addEventListener("click",()=>{
    hero(vehicles[idx], i);
    window.scrollTo({top:0,behavior:"smooth"});
  });
  card.querySelector(".btn-wa").addEventListener("click",async ()=>{
    const txt=makeWhatsappText(v);
    try{
      await navigator.clipboard.writeText(txt);
      alert("Texto copiado");
    }catch{
      alert(txt);
    }
  });
  frag.appendChild(card);
});

grid.appendChild(frag);
}

function apply(){
const q=document.getElementById("search").value.toLowerCase();
const b=document.getElementById("brand").value;
const f=document.getElementById("fuel").value;
const s=document.getElementById("sort").value;

let r=vehicles.filter(v=>{
const t=(String(v.brand)+" "+String(v.model)+" "+String(v.version)).toLowerCase();
return (!q || t.includes(q)) && (!b || v.brand===b) && (!f || v.fuel===f);
});

if(s==="low") r.sort((a,b)=>Number(a.cashPrice||0)-Number(b.cashPrice||0));
if(s==="high") r.sort((a,b)=>Number(b.cashPrice||0)-Number(a.cashPrice||0));

render(r);
}

function clearFilters(){
document.getElementById("search").value="";
document.getElementById("brand").value="";
document.getElementById("fuel").value="";
document.getElementById("sort").value="";
apply();
}

async function loadJSON(){

try{
  const response = await fetch("./catalogo.json?v="+Date.now(), {cache:"no-store"});
  if(!response.ok) throw new Error("No se encontró catalogo.json");

  const data = await response.json();
  vehicles = Array.isArray(data) ? data : [];

  fillFilters();
  apply();

  
}catch(error){
  
  console.error(error);
}
}

document.getElementById("search").addEventListener("input",apply);
document.getElementById("brand").addEventListener("change",apply);
document.getElementById("fuel").addEventListener("change",apply);
document.getElementById("sort").addEventListener("change",apply);

loadJSON();
</script>
</body>
</html>
